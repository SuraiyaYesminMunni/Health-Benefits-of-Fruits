<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin OTP Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <h2>Admin Login via OTP</h2>

    <form id="otp-request-form">
      <input type="email" id="email" placeholder="Enter email" required />
      <button type="submit">Send OTP</button>
    </form>

    <form id="otp-verify-form" style="display:none;">
      <input type="text" id="otp" placeholder="Enter OTP" required />
      <button type="submit">Verify OTP</button>
    </form>

    <p id="message"></p>
  </div>

  <script>
    const otpRequestForm = document.getElementById('otp-request-form');
    const otpVerifyForm = document.getElementById('otp-verify-form');
    const messageEl = document.getElementById('message');

    otpRequestForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;

      const res = await fetch('http://localhost:5000/api/send-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });

      const data = await res.json();
      if (res.ok) {
        messageEl.innerText = "OTP sent to your email.";
        otpRequestForm.style.display = 'none';
        otpVerifyForm.style.display = 'block';
      } else {
        messageEl.innerText = data.error || "Failed to send OTP.";
      }
    });

    otpVerifyForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const otp = document.getElementById('otp').value;

      const res = await fetch('http://localhost:5000/api/verify-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, otp })
      });

      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('adminToken', data.token);
        window.location.href = "index.html";
      } else {
        messageEl.innerText = data.error || "OTP verification failed.";
      }
    });
  </script>
</body>
</html>
